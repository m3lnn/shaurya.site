{{/* A single timeline entry. Child of {{< timeline >}}. */}}
<div class="cs-timeline__item">
  <span class="cs-timeline__dot" aria-hidden="true"></span>
  <div class="cs-timeline__content">
    {{ with .Get "date" }}<span class="cs-timeline__date">{{ . }}</span>{{ end }}
    {{ with .Get "title" }}<h5 class="cs-timeline__title">{{ . }}</h5>{{ end }}
    {{ with .Inner }}<div class="cs-timeline__body">{{ . | markdownify }}</div>{{ end }}
  </div>
</div>
